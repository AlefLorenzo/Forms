<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Testes</title>
  <meta name="description" content="Página de login do Sistema de Cadastro de Usuários — Ambiente de Testes de Software.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>



<!-- Toast Container -->
<div id="toast-container" aria-live="polite"></div>

<!-- Modal de Confirmação -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-box__icon">🗑️</div>
    <h3 id="modal-title">Confirmar ação</h3>
    <p id="modal-message"></p>
    <div class="modal-box__actions">
      <button class="btn btn--secondary" id="modal-cancel">Cancelar</button>
      <button class="btn btn--danger" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div class="loading__spinner"></div>
  <p class="loading__text">Carregando informações...</p>
</div>

<!-- Página de Login -->
<main class="auth-page" id="login-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">🧪</div>
      <h1 class="auth-logo__title">SistemaTest</h1>
      <p class="auth-logo__subtitle">Ambiente de Testes de Software</p>
    </div>

    <h2 class="auth-title">Entrar na sua conta</h2>

    <!-- Formulário de Login -->
    <form id="login-form" novalidate>
      <div class="form-grid" style="gap: 1.25rem;">

        <!-- Nome de usuário -->
        <div class="form-group">
          <label class="form-label" for="field-username">
            Nome de usuário <span class="required">*</span>
          </label>
          <input
            class="form-control"
            type="text"
            id="field-username"
            name="username"
            placeholder="ex: joao123"
            autocomplete="username"
            spellcheck="false"
          >
          <span class="field-error" id="error-username" role="alert"></span>
        </div>

        <!-- Senha -->
        <div class="form-group">
          <label class="form-label" for="field-password">
            Senha <span class="required">*</span>
          </label>
          <div style="position:relative;">
            <input
              class="form-control"
              type="password"
              id="field-password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="current-password"
              style="padding-right: 44px;"
            >
            <button
              type="button"
              id="toggle-password"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-text-muted);font-size:1rem;padding:0;cursor:pointer;"
              aria-label="Mostrar/ocultar senha"
            >👁</button>
          </div>
          <span class="field-error" id="error-password" role="alert"></span>
        </div>

        <!-- Erro geral -->
        <div class="field-error" id="error-general" role="alert" style="display:none;"></div>

        <!-- Botão -->
        <button type="submit" class="btn btn--primary btn--full" id="btn-login">
          Entrar
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Não possui uma conta?
      <a href="cadastro.html" id="link-cadastro">Cadastre-se</a>
    </div>


  </div>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/validations.js"></script>
<script src="js/seed.js"></script>
<script>
  // Inicializa seed
  runSeed();

  // Redireciona se já logado
  redirectIfLoggedIn();

  // Toggle senha
  document.getElementById('toggle-password').addEventListener('click', function () {
    const pw = document.getElementById('field-password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.textContent = pw.type === 'password' ? '👁' : '🙈';
  });

  // Login form
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    clearFormErrors();

    const username = document.getElementById('field-username').value;
    const password = document.getElementById('field-password').value;

    log(`[LOGIN] Tentativa: username="${username}", senha_len=${password.length}`, 'info');

    // Validação de campos obrigatórios
    const { valid, errors } = validateLogin(username, password);
    if (!valid) {
      displayFormErrors(errors);
      return;
    }

    // Autenticação
    const result = login(username, password);
    if (!result.success) {
      // Exibe o erro diretamente no campo ou geral
      const errEl = document.getElementById('error-general');
      errEl.textContent = result.error;
      errEl.style.display = 'flex';
      errEl.classList.add('field-error--visible');
      showToast(result.error, 'error');
      log(`[LOGIN] Falha: ${result.error}`, 'warn');
      return;
    }

    log(`[LOGIN] Sucesso: role=${result.user.role}`, 'info');
    showToast(`Bem-vindo, ${result.user.name.split(' ')[0]}!`, 'success');

    // Redireciona conforme perfil
    setTimeout(() => {
      if (result.user.role === 'ADMIN') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }, 800);
  });
</script>
</body>
</html>
